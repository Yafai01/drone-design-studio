}
async function deleteSaved(btn) {
  if (!btn.classList.contains('armed')) {
    btn.classList.add('armed'); btn.textContent = 'Confirm';
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = 'Delete'; } }, 3000);
    return;
  }
  if (browserSaved()) {
    const items = lsSaved().filter(x => x.id !== btn.dataset.del);
    lsWrite(items); S.saved = items; renderSaved(); if (S.view === 'compare') renderWork();
    return toast('Build deleted');
  }
  try {
    const r = await fetch(`/api/saved/${encodeURIComponent(btn.dataset.del)}`, {method: 'DELETE'});
    const d = await r.json();
    if (d.ok) { S.saved = d.items; renderSaved(); if (S.view === 'compare') renderWork(); toast('Build deleted'); }
  } catch (e) { toast('Could not delete. Check that the app window is still open.'); }
}
function renderCompare() {
  const items = S.saved || [];
  if (items.length < 1) { S.view = null; return renderWork(); }
  const M = it => it.metrics || {}, multi = it => it.kind === 'multirotor';
  const rows = [
    ['Configuration'],
    ['Type', it => ({t: multi(it) ? CRAFT(it.parts.n_motors) : 'Fixed-wing'})],
    ['Size', it => multi(it) ? {t: `${fmt(M(it).wheelbase_mm, 0)} mm wheelbase`} : {t: `${fmt(it.parts.span_m, 2)} m span, AR ${fmt(it.parts.aspect, 1)}`}],
    ['Propeller', it => ({t: `${fmt(it.parts.D_in, 1)} × ${fmt(it.parts.P_in, 1)} in`})],
    ['Motor', it => ({t: `${fmt(it.parts.kv, 0)} KV`})],
    ['Battery', it => ({t: `${it.parts.cells}S ${fmt(it.parts.mah, 0)} mAh`})],
    ['Payload', it => ({v: it.parts.payload_kg, t: `${fmt(it.parts.payload_kg, 1)} kg`})],
    ['Conditions', it => ({t: it.env ? `${fmt(it.env.alt_m, 0)} m, ${fmt(it.env.temp_c, 0)} °C, land at ${fmt(it.env.reserve_pct, 0)}%` : 'Sea level, 15 °C, land at 20%'})],
    ['Performance (physics)'],
    ['Flight time', it => ({v: M(it).flight_min, t: `${fmt(M(it).flight_min, 1)} min`}), 'max'],
    ['All-up weight', it => ({v: M(it).auw_kg, t: `${fmt(M(it).auw_kg, 2)} kg`}), 'min'],
    ['Thrust / weight', it => ({v: M(it).tw_ratio, t: fmt(M(it).tw_ratio, 2)})],
    ['Hover throttle', it => multi(it) ? {t: `${fmt(M(it).hover_throttle_pct, 0)} %`} : {t: '—'}],
    ['Cruise speed', it => multi(it) ? {t: '—'} : {t: `${fmt(M(it).cruise_speed_ms, 1)} m/s`}],
    ['Range', it => multi(it) ? {t: '—'} : {v: M(it).range_km, t: `${fmt(M(it).range_km, 0)} km`}, 'max'],
    ['Peak current', it => ({v: M(it).max_current_a, t: `${fmt(M(it).max_current_a, 0)} A`}), 'min'],
    ['Physics limits', it => ({t: M(it).feasible ? '<span class="st ok">Pass</span>' : '<span class="st over">Fail</span>'})],
  ];
  const body = rows.map(([label, fn, better]) => {
    if (!fn) return `<tr><td class="grp" colspan="${items.length + 1}">${label}</td></tr>`;
    const cells = items.map(fn);
    let best = null;
    if (better) {
      const vs = cells.map(c => c.v).filter(v => v != null && isFinite(v));
      if (vs.length > 1) best = better === 'max' ? Math.max(...vs) : Math.min(...vs);
    }
    return `<tr><td>${label}</td>${cells.map(c => {
      const isBest = best != null && c.v === best;
      return `<td class="mono${isBest ? ' best' : ''}">${c.t}${isBest ? '<span class="bt">best</span>' : ''}</td>`; }).join('')}</tr>`;
  }).join('');
  $('#work').innerHTML = `<div class="cmp-head"><div><h2>Compare saved builds</h2><p>${items.length} build${items.length > 1 ? 's' : ''} · best value in each row is highlighted</p></div>
      <button type="button" class="tbtn" data-act="back">${icon('back')}Back to sheet</button></div>
    <div class="cmpwrap"><div class="scroll"><table class="cmpt"><thead><tr><th></th>${items.map(it =>
      `<th class="bh">${esc(it.name)}<small>Saved ${esc(it.saved || '')}</small><button type="button" class="tbtn" data-open="${esc(it.id)}">Open</button></th>`).join('')}</tr></thead>
      <tbody>${body}</tbody></table></div></div>`;
}

/* ---------------- engineering analysis ---------------- */
function analysisSection() {
  return `<section class="anl" id="anl"><h3 class="h3">Engineering analysis <small>physics simulation, current sheet</small></h3>
    <div id="anlOut"><p class="summary">Calculating weight breakdown and sensitivity…</p></div></section>`;
}
let anlSeq = 0;
async function loadAnalysis() {
  const c = S.cur; if (!c || !$('#anl')) return;
  const seq = ++anlSeq;
  try {
    const r = await fetch('/api/analysis', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({kind: c.kind, ...c.parts, env: c.env})});
    const d = await r.json();
    if (seq !== anlSeq || !$('#anlOut')) return;
    if (!d.ok) { $('#anlOut').innerHTML = `<p class="summary"><span class="err">${esc(d.message)}</span></p>`; return; }
    S.anl = d;
    drawAnalysis(d);
  } catch (e) {
    if (seq === anlSeq && $('#anlOut')) $('#anlOut').innerHTML = '<p class="summary"><span class="err">The analysis could not run because the model server is not responding.</span></p>';
  }
}
function drawAnalysis(d) {
  const multi = d.kind === 'multirotor', f = d.figures, auw = f.auw_kg;
  const ms = d.masses.slice().sort((a, b) => b.kg - a.kg), mmax = Math.max(...ms.map(m => m.kg), 1e-9);
  const heaviest = ms[0];
  const weight = `<div class="wb">${ms.map(m => `<div class="wr"><span class="wn">${esc(m.name)}</span>
      <span class="wbar"><i style="width:${clamp(m.kg / mmax * 100, m.kg > 0 ? 1 : 0, 100)}%"></i></span>
      <span class="wk mono">${m.kg >= 1 ? fmt(m.kg, 2) + ' kg' : fmt(m.kg * 1000, 0) + ' g'}</span><span class="wp mono">${fmt(m.kg / auw * 100, 0)}%</span></div>`).join('')}
    <div class="wr tot"><span class="wn">All-up weight</span><span></span><span class="wk mono">${fmt(auw, 2)} kg</span><span class="wp mono">100%</span></div></div>`;
  const F = (k, v, note) => `<div><dt>${k}</dt><dd class="mono">${v}</dd>${note ? `<dd class="fn">${note}</dd>` : ''}</div>`;
  const figs = `<dl class="figs">
    ${F('Battery energy', `${fmt(f.battery_wh, 0)} Wh`, `${fmt(f.battery_frac * 100, 0)}% of all-up weight`)}
    ${F('Payload fraction', `${fmt(f.payload_frac * 100, 0)}%`, 'Payload ÷ all-up weight')}
    ${multi
      ? F('Hover efficiency', `${fmt(f.g_per_w, 1)} g/W`, 'Weight lifted per watt in hover') +
        F('Disk loading', `${fmt(f.disk_loading, 0)} N/m²`, 'Lower is more efficient') +
        F('Hover power loading', `${fmt(f.w_per_kg, 0)} W/kg`, 'Hover power ÷ weight')
      : F('Lift-to-drag at cruise', fmt(f.l_over_d, 1), `Cruise lift coefficient ${fmt(f.cl_cruise, 2)}`) +
        F('Energy per km', `${fmt(f.wh_per_km, 2)} Wh/km`, 'At cruise speed') +
        F('Cruise power loading', `${fmt(f.w_per_kg, 0)} W/kg`, 'Cruise power ÷ weight')}</dl>`;
  // tornado chart
  const rows = d.sensitivity, n = rows.length;
  const W = 470, lw = 132, rw = 40, top = 10, rh = 36, H = top + n * rh + 30;
  const mx = Math.max(.2, ...rows.flatMap(r => [Math.abs(r.lo.delta), Math.abs(r.hi.delta)]));
  const ax = niceAxis(0, mx, 4), lim = ax.ticks[ax.ticks.length - 1] < mx ? ax.ticks[ax.ticks.length - 1] + ax.step : ax.ticks[ax.ticks.length - 1];
  const cx = lw + (W - lw - rw) / 2, half = (W - lw - rw) / 2, X = v => cx + v / lim * half;
  let g = '';
  for (const t of [-lim, -lim / 2, 0, lim / 2, lim]) {
    g += `<line class="${t === 0 ? 'zero' : 'gl'}" x1="${r1(X(t))}" x2="${r1(X(t))}" y1="${top - 4}" y2="${top + n * rh}"/>
      <text class="ax" x="${r1(X(t))}" y="${top + n * rh + 16}" text-anchor="middle">${t > 0 ? '+' : t < 0 ? '−' : ''}${fmt(Math.abs(t), lim < 2 ? 1 : 0)}</text>`;
  }
  g += `<text class="ax" x="${r1(cx)}" y="${top + n * rh + 29}" text-anchor="middle">change in flight time (min)</text>`;
  rows.forEach((r, i) => {
    const def = SWEEP[r.param], y = top + i * rh, u = def.unit ? ' ' + def.unit : '';
    g += `<text class="tl" x="0" y="${y + 15}">${def.label}</text><text class="tv" x="0" y="${y + 29}">${fmt(r.lo.value, def.d)} / ${fmt(r.hi.value, def.d)}${u}</text>`;
    for (const [side, cls, dy] of [['lo', 'b-lo', 7], ['hi', 'b-hi', 19]]) {
      const e = r[side], x0 = X(0), x1 = X(e.delta), xa = Math.min(x0, x1), w = Math.max(1.5, Math.abs(x1 - x0));
      const tx = e.delta >= 0 ? xa + w + 4 : xa - 4;
      g += `<g><title>${def.label} ${fmt(e.value, def.d)}${u}: ${fmt(e.flight, 1)} min (${e.delta >= 0 ? '+' : '−'}${fmt(Math.abs(e.delta), 2)})${e.feasible ? '' : ', fails limits'}</title>
        <rect class="${cls}" x="${r1(xa)}" y="${y + dy}" width="${r1(w)}" height="10" rx="1.5"/>
        <text class="bv" x="${r1(tx)}" y="${y + dy + 8.5}" text-anchor="${e.delta >= 0 ? 'start' : 'end'}">${e.delta >= 0 ? '+' : '−'}${fmt(Math.abs(e.delta), 1)}${e.feasible ? '' : ' ✕'}</text></g>`;
    }
  });
  const anyFail = rows.some(r => !r.lo.feasible || !r.hi.feasible);
  const lead = rows[0], ldef = SWEEP[lead.param];
  $('#anlOut').innerHTML = `<div class="anl-grid">
    <div><h4 class="sub">Weight breakdown</h4><p class="sublead">${esc(heaviest.name)} is the heaviest item at ${fmt(heaviest.kg / auw * 100, 0)}% of all-up weight.</p>${weight}${figs}</div>
    <div><h4 class="sub">Flight-time sensitivity</h4><p class="sublead"><b>${ldef.label}</b> has the largest effect. Each part moves 10% down and up (cells ±1) with everything else fixed.</p>
      <div class="legend"><span><i class="sw blk" style="opacity:.45"></i>Lower value</span><span><i class="sw blk"></i>Higher value</span>${anyFail ? '<span>✕ fails physics limits</span>' : ''}</div>
      <div class="tornado"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Flight time sensitivity to each part">${g}</svg></div></div></div>`;
}

async function loadLibrary() {
  const key = JSON.stringify(S.env);
  if (LIB.envKey !== key) { LIB.results = {}; LIB.envKey = key; }
  const seq = ++LIB.seq;
  const env = {...S.env};
  for (const f of ENV_FIELDS) if (env[f.key] != null && !isFinite(env[f.key])) env[f.key] = f.nullDefault ? null : f.value;
  await Promise.all(PRESETS.filter(pr => !LIB.results[pr.id]).map(async pr => {
    let d;
    try {
      const r = await fetch('/api/check', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({kind: pr.kind, ...pr.parts, env})});
      d = await r.json();
    } catch (e) { d = {ok:false, message:'Model server not responding'}; }
    if (seq !== LIB.seq) return;
    LIB.results[pr.id] = d;
    const card = $(`#lc_${pr.id} .lc-mw`); if (card) card.innerHTML = presetMetrics(pr);
  }));
}

document.addEventListener('keydown', e => {
  const typing = e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"]');
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); return run(); }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === '?') { e.preventDefault(); return toggleHelp(); }
  if ($('#help')?.open) return;
  const R = S.result;
  if (['1', '2', '3'].includes(k) && R && R.mode === 'design' && R.data.ok && S.view !== 'compare') {
    const i = Number(k) - 1; if (i < R.data.options.length) { R.sel = i; renderWork(); } return;
  }
  if (S.busy) return;
  if (k === 'd' || k === 'c') { const m = k === 'd' ? 'design' : 'check'; if (S.mode !== m) { S.mode = m; persist(); renderAside(); run(); } return; }
  if (k === 'm' || k === 'f') { const kd = k === 'm' ? 'multirotor' : 'fixedwing'; if (S.kind !== kd) { S.kind = kd; persist(); renderAside(); run(); } return; }
  if (k === 't' && S.cur && R?.mode === 'design' && S.view !== 'compare') return loadIntoCheck(S.cur.kind, S.cur.parts, S.cur.env);
  if (k === 'r' && S.cur && S.view !== 'compare') return openReportDialog();
  if (k === 's' && S.cur && S.view !== 'compare') return saveCurrent();
  if (k === 'k' && S.saved.length) { S.view = 'compare'; return renderWork(); }
  if (k === 'l') { S.view = 'library'; return renderWork(); }
});

    let [a, b] = def.def(parts[sp.param]);
    if (sp.param === 'payload_kg' && kind === 'fixedwing') b = Math.min(b, 10);
    sp.lo = +a.toFixed(def.d); sp.hi = +b.toFixed(def.d); sp.key = key; sp.data = null;
  }
  $('#sw_lo').value = sp.lo; $('#sw_hi').value = sp.hi; $('#sw_unit').textContent = def.unit;
  if (sp.data && sp.data.lo === sp.lo && sp.data.hi === sp.hi && sp.data.param === sp.param && sp.data.key === key) return drawSweep();
  const seq = ++sp.seq, out = $('#sweepOut');
  out.classList.add('loading');
  try {
    const r = await fetch('/api/sweep', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({kind, ...parts, param: sp.param, lo: sp.lo, hi: sp.hi, env: c.env})});
    const d = await r.json();
    if (seq !== sp.seq || !$('#sweepOut')) return;
    if (!d.ok) { $('#sweepOut').innerHTML = `<p class="summary"><span class="err">${esc(d.message)}</span></p>`; return; }
    sp.data = {...d, lo: sp.lo, hi: sp.hi, key};
    drawSweep();
  } catch (e) {
    if (seq === sp.seq && $('#sweepOut')) $('#sweepOut').innerHTML = '<p class="summary"><span class="err">The trade study could not run because the model server is not responding.</span></p>';
  }
}
function niceAxis(lo, hi, count = 4, integer = false) {
  const span = Math.max(hi - lo, 1e-9), raw = span / count, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
  let step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  if (integer) step = Math.max(1, Math.round(step));
  const ticks = [];
  for (let t = Math.ceil(lo / step - 1e-9) * step; t <= hi + 1e-9; t += step) ticks.push(+t.toPrecision(12));
  return {step, ticks};
}
function drawSweep() {
  const sp = S.sweep, d = sp.data, c = S.cur, kind = c.kind, parts = c.parts, def = SWEEP[d.param];
  const pts = d.points, n = pts.length, multi = kind === 'multirotor', twLim = multi ? 1.8 : 0.4;
  const W = 760, ml = 54, mr = 104, t1 = 30, h1 = 200, gap = 44, h2 = 116, t2 = t1 + h1 + gap, xb = t2 + h2, H = xb + 46;
  const x0 = pts[0].x, x1 = pts[n - 1].x;
  const X = v => ml + (v - x0) / ((x1 - x0) || 1) * (W - ml - mr);
  const fAx = niceAxis(0, Math.max(...pts.map(p => Math.max(p.phys_flight, p.ml_flight))) * 1.05 || 1);
  const fTop = fAx.ticks[fAx.ticks.length - 1] < Math.max(...pts.map(p => Math.max(p.phys_flight, p.ml_flight))) ? fAx.ticks[fAx.ticks.length - 1] + fAx.step : fAx.ticks[fAx.ticks.length - 1];
  const tMaxRaw = Math.max(twLim * 1.3, ...pts.map(p => Math.max(p.phys_tw, p.ml_tw)));
  const tAx = niceAxis(0, tMaxRaw, 3);
  const tTop = tAx.ticks[tAx.ticks.length - 1] < tMaxRaw ? tAx.ticks[tAx.ticks.length - 1] + tAx.step : tAx.ticks[tAx.ticks.length - 1];
  if (fAx.ticks[fAx.ticks.length - 1] < fTop) fAx.ticks.push(fTop);
  if (tAx.ticks[tAx.ticks.length - 1] < tTop) tAx.ticks.push(+tTop.toPrecision(12));
  const Y1 = v => t1 + h1 - clamp(v, 0, fTop) / fTop * h1, Y2 = v => t2 + h2 - clamp(v, 0, tTop) / tTop * h2;
  const integer = def.d === 0 && (d.param === 'cells' || x1 - x0 <= 20);
  const xAx = niceAxis(x0, x1, 6, integer);
  let g = '';
  // failing bands
  let runStart = null;
  const bands = [];
  pts.forEach((p, i) => {
    if (!p.feasible && runStart === null) runStart = i;
    if ((p.feasible || i === n - 1) && runStart !== null) { bands.push([runStart, p.feasible ? i - 1 : i]); runStart = null; }
  });
  const edge = i => i <= 0 ? X(x0) : i >= n ? X(x1) : X((pts[i - 1].x + pts[i].x) / 2);
  let widest = null;
  for (const [a, b] of bands) {
    const xa = edge(a), xz = edge(b + 1);
    g += `<rect class="band" x="${r1(xa)}" y="${t1}" width="${r1(Math.max(2, xz - xa))}" height="${xb - t1}"/>`;
    if (!widest || xz - xa > widest[1] - widest[0]) widest = [xa, xz];
  }
  if (widest && widest[1] - widest[0] > 84) g += `<text class="bandt" x="${r1((widest[0] + widest[1]) / 2)}" y="${t1 + 14}" text-anchor="middle">FAILS LIMITS</text>`;
  // grids and axes
  for (const t of fAx.ticks) g += `<line class="${t === 0 ? 'base' : 'gl'}" x1="${ml}" x2="${W - mr}" y1="${r1(Y1(t))}" y2="${r1(Y1(t))}"/><text class="ax" x="${ml - 8}" y="${r1(Y1(t) + 3.5)}" text-anchor="end">${fmt(t, fAx.step < 1 ? 1 : 0)}</text>`;
  for (const t of tAx.ticks) g += `<line class="${t === 0 ? 'base' : 'gl'}" x1="${ml}" x2="${W - mr}" y1="${r1(Y2(t))}" y2="${r1(Y2(t))}"/><text class="ax" x="${ml - 8}" y="${r1(Y2(t) + 3.5)}" text-anchor="end">${fmt(t, tAx.step < 1 ? 1 : 0)}</text>`;
  for (const t of xAx.ticks) g += `<line class="gl" x1="${r1(X(t))}" x2="${r1(X(t))}" y1="${xb}" y2="${xb + 5}"/><text class="ax" x="${r1(X(t))}" y="${xb + 18}" text-anchor="middle">${fmt(t, xAx.step < 1 ? (xAx.step < .1 ? 2 : 1) : 0)}</text>`;
  g += `<text class="axt" x="${ml}" y="${t1 - 12}">Flight time (min)</text><text class="axt" x="${ml}" y="${t2 - 12}">Thrust / weight</text>`;
  g += `<text class="axt" x="${r1((ml + W - mr) / 2)}" y="${xb + 38}" text-anchor="middle">${def.label}${def.unit ? ` (${def.unit})` : ''}</text>`;
  // T/W limit
  g += `<line class="lim" x1="${ml}" x2="${W - mr}" y1="${r1(Y2(twLim))}" y2="${r1(Y2(twLim))}"/><text class="limt" x="${W - mr + 8}" y="${r1(Y2(twLim) + 3.5)}">min ${twLim}</text>`;
  // current value
  const cv = parts[d.param];
  if (cv >= x0 && cv <= x1) g += `<line class="cur" x1="${r1(X(cv))}" x2="${r1(X(cv))}" y1="${t1}" y2="${xb}"/><text class="curt" x="${r1(X(cv) + 5)}" y="${t2 + 12}">Your build</text>`;
  // lines
  const path = (key, Y) => pts.map((p, i) => `${i ? 'L' : 'M'}${P(X(p.x), Y(p[key]))}`).join('');
  for (const [Y, mlk, phk] of [[Y1, 'ml_flight', 'phys_flight'], [Y2, 'ml_tw', 'phys_tw']]) {
    g += `<path class="s-ml" d="${path(mlk, Y)}"/><path class="ring" d="${path(phk, Y)}"/><path class="s-phys" d="${path(phk, Y)}"/>`;
    if (n <= 16) g += pts.map(p => `<circle class="m-ml" cx="${r1(X(p.x))}" cy="${r1(Y(p[mlk]))}" r="4"/><circle class="m-phys" cx="${r1(X(p.x))}" cy="${r1(Y(p[phk]))}" r="4"/>`).join('');
  }
  // direct labels at the right end of the flight-time panel
  const last = pts[n - 1];
  let yp = Y1(last.phys_flight), ym = Y1(last.ml_flight);
  if (Math.abs(yp - ym) < 15) { const mid = (yp + ym) / 2, s = yp <= ym ? -1 : 1; yp = mid + s * 7.5; ym = mid - s * 7.5; }
  g += `<line class="s-phys" x1="${W - mr + 6}" x2="${W - mr + 18}" y1="${r1(yp)}" y2="${r1(yp)}"/><text class="lab" x="${W - mr + 23}" y="${r1(yp + 4)}">Physics</text>`;
  g += `<line class="s-ml" x1="${W - mr + 6}" x2="${W - mr + 18}" y1="${r1(ym)}" y2="${r1(ym)}"/><text class="lab" x="${W - mr + 23}" y="${r1(ym + 4)}">ML model</text>`;
  // hover layer
  g += `<g id="xh" style="display:none"><line class="xh" id="xhl" y1="${t1}" y2="${xb}"/>
    <circle class="m-ml" id="xd1" r="4.5"/><circle class="m-phys" id="xd2" r="4.5"/><circle class="m-ml" id="xd3" r="4.5"/><circle class="m-phys" id="xd4" r="4.5"/></g>
    <rect class="hit" id="hit" x="${ml}" y="${t1}" width="${W - ml - mr}" height="${xb - t1}"/>`;
  // summary
  const ok = pts.filter(p => p.feasible);
  const best = ok.length ? ok.reduce((a, b) => b.phys_flight > a.phys_flight ? b : a) : null;
  const unit = def.unit ? ' ' + def.unit : '';
  const now = c.metrics.flight_min;
  const summary = best
    ? `<span>Longest flight that passes all limits: <b>${fmt(best.phys_flight, 1)} min</b> at <b>${fmt(best.x, def.d)}${unit}</b>. Your build: <b>${fmt(now, 1)} min</b> at <b>${fmt(cv, def.d)}${unit}</b>.</span>
       ${Math.abs(best.x - cv) > 1e-6 ? `<button type="button" class="tbtn pri" data-apply="${best.x}">Use ${fmt(best.x, def.d)}${unit}</button>` : ''}`
    : `<span class="err">No value in this range passes the physics limits. Try a wider range or another part.</span>`;
  const table = `<details class="tablev"><summary>Data table</summary><div class="scroll"><table><thead><tr><th class="n">${esc(def.label)}</th><th class="n">Physics flight</th><th class="n">ML flight</th><th class="n">Physics T/W</th><th class="n">All-up weight</th><th>Limits</th></tr></thead><tbody>
    ${pts.map(p => `<tr><td class="n">${fmt(p.x, def.d)}${unit}</td><td class="n">${fmt(p.phys_flight, 1)} min</td><td class="n">${fmt(p.ml_flight, 1)} min</td><td class="n">${fmt(p.phys_tw, 2)}</td><td class="n">${fmt(p.auw, 2)} kg</td><td><span class="st ${p.feasible ? 'ok' : 'over'}">${p.feasible ? 'Pass' : 'Fail'}</span></td></tr>`).join('')}
    </tbody></table></div></details>`;
  $('#sweepOut').classList.remove('loading');
  $('#sweepOut').innerHTML = `<p class="summary">${summary}</p>
    <div class="legend"><span><i class="sw" style="background:var(--s-phys)"></i>Physics simulation</span><span><i class="sw" style="background:var(--s-ml)"></i>ML model</span>
      <span><i class="sw band"></i>Fails physics limits</span><span><i class="sw cur"></i>Your build</span></div>
    <div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="Flight time and thrust-to-weight versus ${esc(def.label)}">${g}</svg><div class="tip" id="tip"></div></div>${table}`;
  // interaction
  const svg = $('#chart svg'), tip = $('#tip');
  let idx = Math.max(0, pts.findIndex(p => p.x >= cv));
  const show = i => {
    idx = clamp(i, 0, n - 1);
    const p = pts[idx], x = X(p.x);
    $('#xh').style.display = '';
    $('#xhl').setAttribute('x1', x); $('#xhl').setAttribute('x2', x);
    [['#xd1', Y1(p.ml_flight)], ['#xd2', Y1(p.phys_flight)], ['#xd3', Y2(p.ml_tw)], ['#xd4', Y2(p.phys_tw)]].forEach(([id, y]) => { $(id).setAttribute('cx', x); $(id).setAttribute('cy', y); });
    tip.innerHTML = `<div class="tt">${fmt(p.x, def.d)}${unit}</div>
      <div class="r"><span><i style="background:var(--s-phys)"></i>Physics flight</span><b>${fmt(p.phys_flight, 1)} min</b></div>
      <div class="r"><span><i style="background:var(--s-ml)"></i>ML flight</span><b>${fmt(p.ml_flight, 1)} min</b></div>
      <div class="r"><span>Thrust / weight</span><b>${fmt(p.phys_tw, 2)}</b></div>
      <div class="r"><span>All-up weight</span><b>${fmt(p.auw, 2)} kg</b></div>
      <div class="r"><span>Physics limits</span><b>${p.feasible ? 'Pass' : 'Fail'}</b></div>`;
    tip.style.display = 'block';
    const box = svg.getBoundingClientRect(), px = x / W * box.width, tw = tip.offsetWidth;
    tip.style.left = `${px + 14 + tw > box.width ? px - tw - 14 : px + 14}px`;
    tip.style.top = `${t1 / H * box.height + 6}px`;
  };
  const hide = () => { $('#xh').style.display = 'none'; tip.style.display = 'none'; };
  const nearest = e => { const box = svg.getBoundingClientRect(), vx = (e.clientX - box.left) / box.width * W;
    let bi = 0; pts.forEach((p, i) => { if (Math.abs(X(p.x) - vx) < Math.abs(X(pts[bi].x) - vx)) bi = i; }); return bi; };
  const hit = $('#hit');
  hit.addEventListener('pointermove', e => show(nearest(e)));
  hit.addEventListener('pointerdown', e => show(nearest(e)));
  hit.addEventListener('pointerleave', hide);
  svg.addEventListener('focus', () => show(idx));
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); show(idx + (e.key === 'ArrowRight' ? 1 : -1)); }
    if (e.key === 'Escape') hide();
  });
}
function renderFail(R) {
  const multi = R.kind === 'multirotor', req = R.req;
  const parts = String(R.data.message || 'No design found.').split(/(?<=\.)\s+/);
  const body = `<div class="nosol"><div class="stamp bad">${R.data.offline ? 'No connection' : 'No solution'}</div>
    <p>${esc(parts[0])}</p>${parts.length > 1 ? `<p style="color:var(--ink2)">${esc(parts.slice(1).join(' '))}</p>` : ''}</div>`;
  $('#work').innerHTML = sheet({svg: body,
    notes: R.mode === 'design' && !R.data.offline ? ['Lower the payload or the minimum flight time.', `Allow a larger ${multi ? 'wheelbase' : 'wingspan'}, or remove the size limit.`, 'Under More constraints, allow more battery cells.'] : ['Restart the app, then run again.'],
    tb: {title: R.mode === 'design' ? `${multi ? 'Multirotor' : 'Fixed-wing'}, ${fmt(req.payload_kg ?? 0, 1)} kg payload` : 'Build check', dwg: '—', scale: '—', sheet: '0 of 0', mass: '—'}});
}

/* linked highlighting between balloons and BOM rows */
const work = $('#work');
function hl(item, on) {
  $$(`[data-item="${item}"]`, work).forEach(el => el.classList.toggle('hi', on));
}
['mouseover', 'focusin'].forEach(ev => work.addEventListener(ev, e => { const t = e.target.closest('[data-item]'); if (t) hl(t.dataset.item, true); }));
['mouseout', 'focusout'].forEach(ev => work.addEventListener(ev, e => { const t = e.target.closest('[data-item]'); if (t) hl(t.dataset.item, false); }));
work.addEventListener('click', e => {
  const b = e.target.closest('button,[data-opt]');
  if (!b) return;
  if (b.dataset.opt != null && S.result) { S.result.sel = Number(b.dataset.opt); return renderWork(); }
  if (b.dataset.panel) return showPanel(b.dataset.panel);
  const menu = b.closest('details.menu'); if (menu) menu.open = false;
  if (b.dataset.open) return openSaved(b.dataset.open);
  if (b.dataset.preset) return openPreset(b.dataset.preset);
  if (b.dataset.libtag) { LIB.tag = b.dataset.libtag; return renderLibrary(); }
  if (b.dataset.sweep) {
    S.sweep.param = b.dataset.sweep; S.sweep.key = null;
    $$('[data-sweep]', work).forEach(x => x.setAttribute('aria-pressed', x === b));
    return loadSweep();
  }
  if (b.dataset.apply != null && S.cur && !S.busy)
    return loadIntoCheck(S.cur.kind, {...S.cur.parts, [S.sweep.param]: Number(b.dataset.apply)}, S.cur.env);
  const act = b.dataset.act;
  if (act === 'tweak' && S.cur && !S.busy) return loadIntoCheck(S.cur.kind, S.cur.parts, S.cur.env);
  if (act === 'report' && S.cur) return openReportDialog();
  if (act === 'save') return saveCurrent();
  if (act === 'print') { document.body.classList.add('printdraw'); return window.print(); }
  if (act === 'csv') return exportCsv();
  if (act === 'back') { S.view = null; return S.result ? renderWork() : run(); }
});
work.addEventListener('submit', e => {
  if (e.target.id !== 'rngForm') return;
  e.preventDefault();
  const sp = S.sweep, def = SWEEP[sp.param];
  const lo = Number($('#sw_lo').value.replace(',', '.')), hi = Number($('#sw_hi').value.replace(',', '.'));
  const [a, b] = def.lim;
  if (!isFinite(lo) || !isFinite(hi) || lo < a || hi > b || hi <= lo) {
    $('#sweepOut').innerHTML = `<p class="summary"><span class="err">Enter a range from ${fmt(a, def.d)} to ${fmt(b, def.d)}${def.unit ? ' ' + def.unit : ''}, with the end larger than the start.</span></p>`;
    return;
  }
  sp.lo = lo; sp.hi = hi;
  loadSweep();
});

/* theme */
const root = document.documentElement;
const effTheme = () => root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const syncTheme = () => $$('#theme button').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === effTheme()));
try { const t = localStorage.getItem('dds-theme'); if (t) root.dataset.theme = t; } catch (e) {}
$('#theme').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  root.dataset.theme = b.dataset.themeSet;
  try { localStorage.setItem('dds-theme', b.dataset.themeSet); } catch (e) {}
  syncTheme();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);
syncTheme();

const infoP = fetch('/api/info').then(r => r.json()).then(i => {
  S.info = i;
  $('#meta').innerHTML = `<b>●</b> Model loaded · scikit-learn ${esc(i.sklearn)} · Python ${esc(i.python)}`;
  return i;
}).catch(() => { $('#meta').textContent = 'Model server not reachable'; return null; });

$('#helpBtn').addEventListener('click', () => toggleHelp(true));
const wantCompare = location.hash.includes('compare');
infoP.then(() => browserSaved() ? {ok: true, items: lsSaved()} : fetch('/api/saved').then(r => r.json())).then(d => {
  if (d.ok) { S.saved = d.items; renderSaved(); }
  if (wantCompare) { if (S.saved.length) { S.view = 'compare'; renderWork(); } else run(); }
}).catch(() => { if (wantCompare) run(); });

renderAside();
if (location.hash.includes('library')) { S.view = 'library'; renderWork(); }
else if (!wantCompare) run();
</script>
